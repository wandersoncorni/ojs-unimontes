services:
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: ojs_uptime
    restart: unless-stopped
    volumes:
      - ./data/monitoring/uptime:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:3001:3001"
    networks:
      - ojs_frontend

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: ojs_cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - ojs_monitoring

  prometheus:
    image: prom/prometheus:latest
    container_name: ojs_prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./data/monitoring/prometheus:/prometheus
    networks:
      - ojs_monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: ojs_grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
    volumes:
      - ./data/monitoring/grafana:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - ojs_monitoring

networks:
  ojs_frontend:
    external: true
  ojs_monitoring:
    driver: bridge
    internal: true
