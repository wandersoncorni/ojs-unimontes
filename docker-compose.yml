services:
  nginx:
    image: nginx:alpine
    container_name: ojs_proxy
    restart: unless-stopped
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - type: bind
        source: /srv/portal/journals
        target: /var/www/html/public/journals
        read_only: true
        bind:
          propagation: rprivate
    depends_on:
      ojs:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "code=$$(curl -k -sS -o /dev/null -w '%{http_code}' http://127.0.0.1/); case \"$$code\" in 200|301|302) exit 0;; *) exit 1;; esac"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - ojs_frontend

  ojs:
    build:
      context: ./ojs
      dockerfile: Dockerfile
    container_name: ojs_portal
    restart: unless-stopped
    # Sistema de arquivos somente leitura + tmpfs para diretórios voláteis do Debian/Apache/OJS
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
      - /var/run/apache2:rw,noexec,nosuid,uid=33,gid=33,size=16m
      - /var/lock/apache2:rw,noexec,nosuid,uid=33,gid=33,size=16m
      - /var/log/apache2:rw,noexec,nosuid,uid=33,gid=33,size=64m
      - /var/www/html/cache:rw,noexec,nosuid,uid=33,gid=33,size=256m
      - /run/ojs:rw,noexec,nosuid,uid=33,gid=33,size=16m
      - /etc/ssl/apache2:rw,noexec,nosuid,uid=33,gid=33,size=16m
    # Princípio do menor privilégio
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    # Impede escalonamento de privilégios
    security_opt:
      - no-new-privileges:true
    # Limites de recursos (cgroups) contra OOM e fork bombs
    deploy:
      resources:
        limits:
          cpus: 2.0
          memory: 1536M
          pids: 250
    ulimits:
      nofile:
        soft: 2048
        hard: 4096
    # Bind mounts isolados (rprivate)
    volumes:
      - type: bind
        source: ./data/files
        target: /var/www/files
        bind:
          propagation: rprivate
      - type: bind
        source: ./data/journals
        target: /var/www/html/public/journals
        bind:
          propagation: rprivate
      - ./data/public:/var/www/html/public
    environment:
      - OJS_WEB_CONF=/var/www/html/config.inc.php
      - PKP_CONF=/run/ojs/config.inc.php
      - APP_KEY=${APP_KEY}
    command: ["/usr/local/bin/ojs-start-readonly"]
    secrets:
      - ojs_config
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/index.php/index/about || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - ojs_frontend
      - ojs_backend

  db:
    image: mariadb:10.11
    container_name: ojs_db
    restart: unless-stopped
    environment:
      - MARIADB_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MARIADB_DATABASE=${DB_NAME}
      - MARIADB_USER=${DB_USER}
      - MARIADB_PASSWORD=${DB_PASSWORD}
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-buffer-pool-size=1G
      --max-allowed-packet=64M
    volumes:
      - ojs_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ojs_backend


volumes:
  ojs_db_data:

secrets:
  ojs_config:
    file: ./ojs/config.inc.php

networks:
  ojs_frontend:
    driver: bridge
  ojs_backend:
    driver: bridge
    internal: true
